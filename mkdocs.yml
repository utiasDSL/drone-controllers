site_name: Drone Controllers
site_description: Controllers for quadrotor drones
site_url: https://learnsyslab.github.io/drone-controllers/
repo_url: https://github.com/learnsyslab/drone-controllers
repo_name: learnsyslab/drone-controllers

theme:
  name: material
  logo: img/logo_white.png
  favicon: img/logo.png
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Get Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - User Guide:
    - Controllers: user-guide/controllers.md
    - Mellinger: user-guide/mellinger.md
    - Parametrize: user-guide/parametrize.md
    - Batching: user-guide/batching.md
    - JIT Compilation: user-guide/jit.md
    - Integral Errors: user-guide/integral-errors.md
  - Examples: examples/index.md
  - API Reference:
    - Core: api/core.md
    - Drones: api/drones.md
    - Transform: api/transform.md
    - Mellinger: api/mellinger.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: false
            show_bases: false
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/learnsyslab/drone-controllers

extra_css:
  - stylesheets/extra.css

watch:
  - drone_controllers/
